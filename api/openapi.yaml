          $ref: "#/components/schemas/ToolReceipt"
        event:
          $ref: "#/components/schemas/RoomEvent"

    RequestToolCall:
      type: object
      additionalProperties: false
      required: [agent_id, kind, tool, input]
      properties:
        agent_id:
          type: string
        kind:
          type: string
          enum: [read, write, external, shell, native]
        tool:
          type: string
        input:
          description: Tool-specific JSON input.
        approval_id:
          type: string
          description: Required for every kind except `read`.

    CompleteToolCallRequest:
      type: object
      additionalProperties: false
      properties:
        output:
          type: string
        success:
          type: boolean
          default: true

    NodeInfo:
      type: object
      additionalProperties: false
      required: [server_id, server_code, account_id, device_id, endpoint, url, relay_mode, relay_setting, relay_connected, relay_tunnel, mdns, mdns_peers, quic, tls_fingerprint, protocol]
      properties:
        server_id:
          type: string
        server_code:
          type: string
        account_id:
          type: string
        device_id:
          type: string
        endpoint:
          type: string
          description: Host and port peers connect to.
          examples: ["192.168.1.20:7717"]
        url:
          type: string
          description: |
            Composite HTTPS base URL peers use, with an optional relay
            fallback and public port-mapping alternates in the fragment.
            Clients try the LAN host first, then each `alt` host:port.
          examples: ["https://192.168.1.20:7717#fp=<hex>&relay=https%3A%2F%2Frelay.example%3A7719%2Frelay%2Fv1%2Fnode%2F<server-id>%23fp%3D<hex>&alt=203.0.113.9%3A7717"]
        direct_url:
          type: string
          description: Pinned LAN URL without a relay fallback.
        relay_url:
          type: string
          description: Pinned relay route for this node, when configured.
        relay_base:
          type: string
          description: Relay origin currently in use, without the per-node route.
        relay_mode:
          type: string
          enum: [off, auto, pinned]
          description: |
            `off` disables relay fallback, `auto` follows the directory's
            advertised relay, and `pinned` uses the URL in `relay_setting`.
        relay_setting:
          type: string
          description: |
            Canonical persisted setting: `off`, `auto`, or a pinned relay URL
            with its certificate fingerprint in the fragment.
        relay_connected:
          type: boolean
          description: Whether the node currently has an active relay session.
        relay_tunnel:
          type: boolean
          description: |
            Whether the active relay session uses the WebSocket tunnel. When
            false, the node uses the HTTPS long-poll fallback.
        directory_url:
          type: string
          description: Pinned public directory URL used by this node.
        mdns:
          type: boolean
          description: Whether same-LAN multicast discovery is configured.
        mdns_peers:
          type: integer
          minimum: 0
          description: Number of current LAN advertisements.
        quic:
          type: boolean
          description: |
            Whether the node is serving HTTP/3 on UDP alongside HTTPS. Clients
            select it only after a successful health probe and fall back to
            HTTPS without retrying an ambiguous request.
        nat_method:
          type: string
          description: |
            Gateway mapping protocol in use (`pcp`, `natpmp`, or `upnp`).
            Absent when no mapping is active.
        external_endpoint:
          type: string
          description: |
            Public host:port learned from the gateway mapping. It is an
            alternate direct address, not a replacement for `endpoint`.
        external_url:
          type: string
          description: Pinned HTTPS URL for `external_endpoint`.
        tls_fingerprint:
          type: string
          description: Hex SHA-256 fingerprint of the node's self-signed certificate.
          pattern: "^[0-9a-f]{64}$"
        protocol:
          type: integer

    DirectoryRecord:
      type: object
      additionalProperties: false
      required: [server_id, server_code, account_id, endpoint, url, direct_url, tls_fingerprint]
      properties:
        server_id:
          type: string
        server_code:
          type: string
        account_id:
          type: string
        endpoint:
          type: string
        url:
          type: string
          description: |
            Composite pinned URL with an optional relay fallback and public
            port-mapping alternates.
        direct_url:
          type: string
        relay_url:
          type: string
        external_endpoint:
          type: string
          description: Public host:port published by the node's gateway mapping.
        external_url:
          type: string
        tls_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        updated_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [directory, mdns, card]
          description: Where the verified record came from.

    CardView:
      type: object
      additionalProperties: false
      required: [server_id, server_code, account_id, card, identity_expires_at, node_expires_at]
      properties:
        server_id:
          type: string
        server_code:
          type: string
          pattern: "^[0-9]{8}$"
        account_id:
          type: string
          pattern: "^[0-9]{14}$"
        label:
          type: string
          maxLength: 128
        card:
          type: string
          description: Portable `toget-card:v1:` payload.
        added_at:
          type: string
          format: date-time
          description: When this node saved the card. Absent on this node's own card.
        identity_expires_at:
          type: string
          format: date-time
        node_expires_at:
          type: string
          format: date-time

    CardResponse:
      type: object
      additionalProperties: false
      required: [card]
      properties:
        card:
          $ref: "#/components/schemas/CardView"

    CardsResponse:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardView"

    AddCardRequest:
      type: object
      additionalProperties: false
      required: [card]
      properties:
        card:
          type: string
          description: Portable `toget-card:v1:` payload.
        label:
          type: string
          maxLength: 128
          description: Optional local display label; defaults to the card's label or server code.

    DiscoveredPeer:
      type: object
      additionalProperties: false
      required: [server_id, server_code, protocol, tls_fingerprint, port, addresses, last_seen]
      properties:
        server_id:
          type: string
        server_code:
          type: string
          pattern: "^[0-9]{8}$"
        protocol:
          type: integer
        tls_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        port:
          type: integer
          minimum: 1
          maximum: 65535
        addresses:
          type: array
          items:
            type: string
        last_seen:
          type: string
          format: date-time

    NodeDiscoveryResponse:
      type: object
      additionalProperties: false
      required: [enabled, peers]
      properties:
        enabled:
          type: boolean
        peers:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredPeer"

    NodeInfoResponse:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        info:
          $ref: "#/components/schemas/NodeInfo"

    RecoveryStatus:
      type: object
      additionalProperties: false
      required: [enabled, device_id]
      properties:
        enabled:
          type: boolean
        created_at:
          type:
            - string
            - "null"
          format: date-time
        device_id:
          type: string

    RecoveryCredential:
      type: object
      additionalProperties: false
      required: [filename, content, created_at]
      properties:
        filename:
          type: string
          examples:
            - "toget-recovery-68173501840479-0199a1b2.togetkey"
            - "toget-account-recovery-68173501840479.togetkey"
        content:
          type: string
          maxLength: 16384
          description: |
            The complete recovery file. It may be a per-device vault recovery
            file or an official account recovery file. It is a bearer secret:
            store it offline and never send it through chat or unencrypted
            storage.
        created_at:
          type: string
          format: date-time

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        credential:
          type: string
          maxLength: 16384
          description: The complete contents of a `.togetkey` recovery file. Required unless `local` is true.
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
        local:
          type: boolean
          default: false
          description: Reset while this device is unlocked without the old password or a recovery file.

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
        device_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Defaults to the machine hostname.
        host_url:
          type: string
          format: uri
          description: |
            Official account host URL. When set, the node registers an
            official-hosted account instead of creating a local one. Supply
            exactly one trust anchor: `#fp=<hex>` (alias `#sha256=<hex>`) for
            an exact origin certificate pin, or `#id=<server-id>` behind a
            TLS-terminating proxy.
        email:
          type: string
          format: email
          maxLength: 254
          description: Optional email for official account verification and recovery.

    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        topic:
          type: string
          maxLength: 280
        home:
          type: string
          enum: [node, official]
          default: node
          description: |
            `official` requires a connected official account. The official
            home is blind to room content and ordering is host-assigned.

    UpdateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        topic:
          type: string
          maxLength: 280

    PostMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 65536
        format:
          type: string
          enum: [plain, markdown]
          default: plain
        attachments:
          type: array
          maxItems: 10
          items:
            type: string
          description: Attachment IDs uploaded to this room. Node-hosted rooms only; official rooms reject attachments.
        mentions:
          type: array
          items:
            type: string
          description: Agent IDs mentioned in this message.
        reply_to:
          type: string
          description: Event ID being replied to.
        agent_id:
          type: string
          description: |
            Attribute the message to a local Agent owned by this account. The
            cryptographic author remains the account's device. The Agent must
            be a member of the room and must not be revoked. Mentions written
            in the text are detected automatically and merged into `mentions`.

    EditMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536

    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [history]
      properties:
        history:
          type: string
          enum: [none, recent, all]
        ttl_seconds:
          type: integer
          minimum: 0
          description: Defaults to 7 days when zero.
