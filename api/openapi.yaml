openapi: 3.1.0
info:
  title: Toget Local API
  version: 0.1.0-dev
  description: |
    The local API is how the CLI, the web UI, and local Agents talk to a Toget
    node. It listens on loopback only (`127.0.0.1:7718` by default).

    Authentication is either a bearer token read from the user-only token file
    (CLI and local programs) or the HttpOnly `toget_token` cookie set when the
    web UI is loaded. Browser requests with an `Origin` header are checked
    against the loopback origin allowlist.

    This contract is additive within `/api/v1`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:7718
    description: Default local node
tags:
  - name: system
  - name: account
  - name: rooms
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The node is running.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
  /api/v1/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: Node, version, account, and room summary
      responses:
        "200":
          description: Current node status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
  /api/v1/account:
    get:
      tags: [account]
      operationId: getAccount
      summary: Read the local account
      responses:
        "200":
          description: The local account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AccountNotFound"
    post:
      tags: [account]
      operationId: createAccount
      summary: Create the account for this node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AccountExists"
  /api/v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms, newest first
      responses:
        "200":
          description: Rooms visible to this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room and its first event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: The room and its `room.created` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoomResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AccountNotFound"
  /api/v1/rooms/{id}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Read one room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
  /api/v1/rooms/{id}/events:
    get:
      tags: [rooms]
      operationId: listRoomEvents
      summary: Read a room timeline
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: after
          in: query
          description: Return events with a sequence greater than this value.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum number of events. The node caps this at 1000.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Events in sequence order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "500":
          $ref: "#/components/responses/CorruptEvent"
  /api/v1/rooms/{id}/messages:
    post:
      tags: [rooms]
      operationId: postMessage
      summary: Append a message to a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "201":
          description: The appended `message.posted` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "413":
          $ref: "#/components/responses/MessageTooLong"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token read from the user-only `api-token` file.
    cookieAuth:
      type: apiKey
      in: cookie
      name: toget_token
      description: HttpOnly, SameSite=Strict cookie set when the web UI loads.
  parameters:
    RoomID:
      name: id
      in: path
      required: true
      description: Room ID (UUIDv7 for locally created rooms).
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A local API token is required.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="toget"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OriginDenied:
      description: The request Origin is not a loopback origin for this node.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountNotFound:
      description: This node has no account yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountExists:
      description: This node already has an account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoomNotFound:
      description: The room does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageTooLong:
      description: The message exceeds the local size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CorruptEvent:
      description: An event failed its integrity check.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              examples:
                - account_not_found
            message:
              type: string
              description: Human-readable explanation.
    VersionInfo:
      type: object
      additionalProperties: false
      required: [app, commit, build_time, protocol, schema, go_version, os, arch]
      properties:
        app:
          type: string
          examples: [0.1.0-dev]
        commit:
          type: string
        build_time:
          type: string
        protocol:
          type: integer
        schema:
          type: integer
        go_version:
          type: string
        os:
          type: string
        arch:
          type: string
    Account:
      type: object
      additionalProperties: false
      required: [id, name, server_id, server_code, created_at]
      properties:
        id:
          type: string
          description: 14 decimal digits: 8-digit server code plus 6-digit account code.
          pattern: "^[0-9]{14}$"
          examples: ["68173501840479"]
        name:
          type: string
        server_id:
          type: string
          description: Full fingerprint of the server root key.
          examples: ["tog1:s:5774DJPB5NPVMTFV48P6B1MWJ1AK22P7J0949BNZ3KJN8YXMXNE0"]
        server_code:
          type: string
          pattern: "^[0-9]{8}$"
        created_at:
          type: string
          format: date-time
    Status:
      type: object
      additionalProperties: false
      required: [version, account, rooms, listen]
      properties:
        version:
          $ref: "#/components/schemas/VersionInfo"
        account:
          oneOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
        rooms:
          type: integer
          minimum: 0
        listen:
          type: string
          examples: ["127.0.0.1:7718"]
    Room:
      type: object
      additionalProperties: false
      required: [id, name, home_node, created_by, epoch, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        home_node:
          type: string
          description: Device ID of the node that orders this room's log.
        created_by:
          type: string
          description: Account ID of the creator.
        epoch:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    RoomEvent:
      type: object
      additionalProperties: false
      required: [id, room_id, seq, type, author_id, payload, created_at, hash]
      properties:
        id:
          type: string
        room_id:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          examples: ["message.posted"]
        author_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        prev_id:
          type: string
        hash:
          type: string
          description: SHA-256 hash chain value over the event fields and payload.
    RoomList:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"
    EventList:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/RoomEvent"
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
        device_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Defaults to the machine hostname.
    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    CreateRoomResponse:
      type: object
      additionalProperties: false
      required: [room, event]
      properties:
        room:
          $ref: "#/components/schemas/Room"
        event:
          $ref: "#/components/schemas/RoomEvent"
    PostMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536
