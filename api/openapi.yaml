          type: string

    PolicyRule:
      type: object
      additionalProperties: false
      required: [id, effect]
      properties:
        id:
          type: string
          maxLength: 64
        effect:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          maxLength: 256
          description: Action kind glob; empty matches any kind.
        tool:
          type: string
          maxLength: 256
        target:
          type: string
          maxLength: 256
        recipient:
          type: string
          maxLength: 256
        amount_min:
          type: string
          maxLength: 64
          description: Exact decimal lower bound.
        amount_max:
          type: string
          maxLength: 64
        currency:
          type: string
          maxLength: 16
        weekdays:
          type: array
          description: 0=Sunday through 6=Saturday; empty matches any day.
          items:
            type: integer
            minimum: 0
            maximum: 6
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local start time. An end before start crosses midnight.
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        timezone:
          type: string
          maxLength: 64
          description: IANA zone or Local. Defaults to Local.
        note:
          type: string
          maxLength: 200

    PolicyRuleInput:
      type: object
      additionalProperties: false
      required: [effect]
      description: |
        Rule input. Missing ids are generated; supplied ids must be unique.
        Empty selector fields match anything. Globs support `*` and `?`.
      properties:
        id:
          type: string
          maxLength: 64
        effect:
          type: string
          enum: [allow, deny]
        kind:
          type: string
          maxLength: 256
        tool:
          type: string
          maxLength: 256
        target:
          type: string
          maxLength: 256
        recipient:
          type: string
          maxLength: 256
        amount_min:
          type: string
          maxLength: 64
        amount_max:
          type: string
          maxLength: 64
        currency:
          type: string
          maxLength: 16
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        timezone:
          type: string
          maxLength: 64
        note:
          type: string
          maxLength: 200

    Policy:
      type: object
      additionalProperties: false
      required: [id, room_id, rules, created_at, updated_at]
      properties:
        id:
          type: string
        room_id:
          type: string
        agent_id:
          type: string
