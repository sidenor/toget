openapi: 3.1.0
info:
  title: Toget Local API
  version: 0.1.0-dev
  description: |
    The local API is how the CLI, the web UI, and local Agents talk to a Toget
    node. It listens on loopback only (`127.0.0.1:7718` by default).

    Authentication is either a bearer token read from the user-only token file
    (CLI and local programs) or the HttpOnly `toget_token` cookie set when the
    web UI is loaded. Browser requests with an `Origin` header are checked
    against the loopback origin allowlist.

    Most routes require an unlocked local session. `GET /api/v1/session` and
    `POST /api/v1/session` are available while locked so a client can present
    the unlock screen; all data routes answer `423 locked` until the account
    password has been verified. Unlocking lasts for 12 hours and is extended
    by activity.

    This contract is additive within `/api/v1`. The LAN transport between
    nodes is a separate signed HTTPS protocol, documented in
    `docs/protocol.md`; `GET /api/v1/node` exposes this node's public LAN
    identity for local clients.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:7718
    description: Default local node
tags:
  - name: system
  - name: updates
  - name: session
  - name: account
  - name: devices
  - name: node
  - name: rooms
  - name: messages
  - name: membership
  - name: attachments
  - name: agents
  - name: approvals
  - name: policies
  - name: tools
  - name: backups
  - name: notifications
  - name: audit
  - name: search
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The node is running.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"

  /api/v1/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Read the local unlock state
      description: Available while the node is locked.
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
    post:
      tags: [session]
      operationId: unlock
      summary: Unlock this node with the account password
      description: |
        Available while locked. Failed attempts are rate-limited per client
        address. A successful unlock keeps the session open for 12 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
      responses:
        "200":
          description: The node is unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [session]
      operationId: lock
      summary: Lock this node immediately
      responses:
        "204":
          description: The session is locked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"

  /api/v1/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: Node, version, account, and room summary
      description: Available while locked; counts are only populated when unlocked.
      responses:
        "200":
          description: Current node status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"

  /api/v1/update:
    get:
      tags: [updates]
      operationId: getUpdateStatus
      summary: Read the update monitor state
      description: |
        Returns the installed release, last check result, dismissal, staged
        update, and managed-install state. Unavailable when updates are not
        configured on this node.
      responses:
        "200":
          description: Current update status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/update/check:
    post:
      tags: [updates]
      operationId: checkForUpdate
      summary: Check the signed channel for an update
      description: |
        Verifies the channel and manifest, selects this OS/arch, applies the
        rollout bucket and compatibility rules, and records the result for the
        in-app banner. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCheckRequest"
      responses:
        "200":
          description: The verified check result and updated monitor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/update/apply:
    post:
      tags: [updates]
      operationId: applyUpdate
      summary: Stage an offered release
      description: |
        Downloads and verifies the artifact, extracts it to a staged version
        directory, runs a preflight check, switches `current`, and optionally
        runs the configured restart command. A restart is never implied by an
        automatic check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplyRequest"
      responses:
        "200":
          description: The staged update and updated monitor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateApplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/update/dismiss:
    post:
      tags: [updates]
      operationId: dismissUpdate
      summary: Postpone an update banner
      description: |
        Defaults to 24 hours. Recommended and security releases can be
        postponed for at most seven days; a forced release for at most 24
        hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDismissRequest"
      responses:
        "200":
          description: Updated monitor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [updates]
      operationId: clearUpdateDismissal
      summary: Show a postponed update again
      responses:
        "200":
          description: Updated monitor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/update/rollback:
    post:
      tags: [updates]
      operationId: rollbackUpdate
      summary: Discard a pending update or return to the previous release
      responses:
        "200":
          description: The rollback result and updated monitor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateApplyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/update/restart:
    post:
      tags: [updates]
      operationId: restartForUpdate
      summary: Run the configured local restart command
      description: |
        Starts the local restart command after a short delay. Only available
        when `update.restart` is configured and the platform supports a
        detached restart; Windows returns `restart_not_configured` or an
        update error instead.
      responses:
        "202":
          description: The restart command was launched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRestartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/backups:
    get:
      tags: [backups]
      operationId: listBackups
      summary: List local backup archives
      responses:
        "200":
          description: Backup files in the node's backup directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [backups]
      operationId: createBackup
      summary: Write a new encrypted snapshot
      responses:
        "201":
          description: The new backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupArchive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/backups/{name}/download:
    get:
      tags: [backups]
      operationId: downloadBackup
      summary: Download a local backup archive
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The backup zip archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/backups/{name}:
    delete:
      tags: [backups]
      operationId: deleteBackup
      summary: Delete a local backup archive
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The backup was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/restore/uploads:
    post:
      tags: [backups]
      operationId: uploadRestore
      summary: Upload and verify a backup for restore
      description: |
        Streams a raw zip archive, validates every manifest entry and file
        checksum, and keeps the verified upload for confirmation. The upload
        is deleted after staging or cancellation.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The verified upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/restore/uploads/{id}:
    delete:
      tags: [backups]
      operationId: deleteRestoreUpload
      summary: Discard an inspected restore upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The upload was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/restore:
    get:
      tags: [backups]
      operationId: getRestore
      summary: Read the staged restore
      responses:
        "200":
          description: Staged restore state and restart availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [backups]
      operationId: stageRestore
      summary: Stage a verified backup for the next restart
      description: |
        Re-verifies the archive and stages it. The database, vault key, and
        attachments are only replaced when the daemon starts again. Existing
        data is moved to a timestamped `pre-restore-*` directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageRestoreRequest"
      responses:
        "201":
          description: The staged restore.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [backups]
      operationId: cancelRestore
      summary: Cancel a staged restore
      responses:
        "204":
          description: No restore is staged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/restore/restart:
    post:
      tags: [backups]
      operationId: restartForRestore
      summary: Restart the node to apply a staged restore
      responses:
        "202":
          description: The restart command was launched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreRestartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: getNotifications
      summary: Read Web Push configuration and subscriptions
      description: |
        Returns the node's VAPID public key and registered browser
        subscriptions. Push payloads are content-free; subscription endpoints
        and browser encryption keys are never returned by this API.
      responses:
        "200":
          description: Notification settings and registered browsers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/notifications/subscriptions:
    post:
      tags: [notifications]
      operationId: subscribeNotifications
      summary: Register a browser push subscription
      description: |
        Stores a standard Web Push subscription. Re-posting the same endpoint
        refreshes its keys and preserves the user's event preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSubscriptionInput"
      responses:
        "201":
          description: The registered subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/notifications/subscriptions/{id}:
    patch:
      tags: [notifications]
      operationId: updateNotificationSubscription
      summary: Change event preferences for a browser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSubscriptionUpdate"
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [notifications]
      operationId: deleteNotificationSubscription
      summary: Remove a browser subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The subscription was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/notifications/subscriptions/{id}/test:
    post:
      tags: [notifications]
      operationId: testNotificationSubscription
      summary: Send a test notification
      description: Bypasses the global mute and rate limit for one browser.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The push service accepted the test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/notifications/mute:
    post:
      tags: [notifications]
      operationId: muteNotifications
      summary: Pause notifications on every browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationMuteRequest"
      responses:
        "200":
          description: Updated notification state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/account:
    get:
      tags: [account]
      operationId: getAccount
      summary: Read the local account
      responses:
        "200":
          description: The local account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AccountNotFound"
    post:
      tags: [account]
      operationId: createAccount
      summary: Create a self-hosted or official-hosted account
      description: |
        Without `host_url`, the account ID is derived from this node's server
        identity and the account lives on this machine. With `host_url`, the
        node registers an official-hosted account: OPAQUE registration and
        sealed key material go to the host, and the response includes the
        one-time official recovery file under `recovery`. Creating the
        account also unlocks the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: The account was created. Official hosting also returns `recovery`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AccountExists"
        "503":
          description: Official hosting is not configured on this node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/account/hosted/login:
    post:
      tags: [account]
      operationId: loginHostedAccount
      summary: Add this device to an official-hosted account
      description: |
        Performs an OPAQUE login with the account password, unwraps the
        account master key locally, and initializes this device's local vault.
        The node must not already have an account. The password is used once
        and is not stored on the host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostedLoginRequest"
      responses:
        "201":
          description: The device joined the account and the session is unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "409":
          $ref: "#/components/responses/AccountExists"
        "503":
          description: Official hosting is not configured on this node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List devices enrolled in this account
      responses:
        "200":
          description: Devices belonging to this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/devices/{id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device
      description: The current device cannot revoke itself.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The device is revoked, but some room homes could not be reached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, warnings]
                properties:
                  ok:
                    type: boolean
                  warnings:
                    type: array
                    items:
                      type: string
        "204":
          description: The device is revoked everywhere this node knows about.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The current device cannot revoke itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/account/sync:
    post:
      tags: [devices]
      operationId: syncAccount
      summary: Exchange account device records with paired devices now
      description: |
        Devices also sync in the background every 30 seconds and after pairing
        or revocation. This route runs one round immediately. Each reachable
        sibling receives the full public device set over pinned HTTPS; private
        keys never leave the device. The local device cannot revoke itself and
        an already-revoked device receives read-only records so it discovers
        the revocation.
      responses:
        "200":
          description: One sync round finished. Unreachable peers are warnings, not failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSyncResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          description: Node transport is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/account/rotate-key:
    post:
      tags: [account]
      operationId: rotateAccountKey
      summary: Rotate the account signing key
      description: |
        Creates a new account signing key, signs a rotation statement with both
        the old and new keys, and re-signs every active device certificate.
        Paired devices receive the new key through account sync, sealed to
        their device encryption key. Room homes receive the new member key
        separately; unreachable homes are returned as warnings and retried.
        An official-hosted account requires the account password so the new
        key bundle can be sealed and published to the host; a self-hosted
        account ignores it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  format: password
                  description: Required for an official-hosted account.
      responses:
        "200":
          description: The account key was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateAccountKeyResult"
        "400":
          description: The official-hosted account password is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          description: Node transport is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/account/recovery:
    get:
      tags: [account]
      operationId: getRecovery
      summary: Read the local recovery-file state
      description: |
        Reports whether this device's vault has a recovery wrap. This route is
        available while locked because it does not reveal key material.
      responses:
        "200":
          description: The recovery state for this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AccountNotFound"
    post:
      tags: [account]
      operationId: createRecovery
      summary: Create a local recovery file or rotate the official one
      description: |
        Without a body, wraps this device's vault master key with a new
        high-entropy recovery key and returns the credential file once. The
        previous per-device recovery file stops working. The vault must be
        unlocked.

        With `{"official": true, "password": "..."}`, rotates the
        official-hosted account's recovery file instead: the new recovery key
        wraps the account master key and the host replaces the old recovery
        wrap. The password is required. Store either returned file offline.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                official:
                  type: boolean
                  default: false
                  description: Rotate the official account recovery file instead of the per-device file.
                password:
                  type: string
                  format: password
                  description: "Required when `official` is true."
      responses:
        "201":
          description: The recovery file was created. Its content is returned once.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCredential"
        "400":
          description: The request is invalid or the official password is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          description: Official hosting is not configured on this node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [account]
      operationId: removeRecovery
      summary: Remove this device's recovery file
      description: The password is unchanged; only the recovery wrap is removed.
      responses:
        "204":
          description: The recovery file was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "409":
          description: This device has no recovery file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/account/change-password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Change the account password on this device
      description: |
        Verifies the current password, replaces the local password verifier,
        and re-wraps this device's vault master key under the new password.
        Other devices keep their own local password. The recovery file, if
        present, remains valid. A successful change unlocks the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: The password was changed and the node is unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/account/reset-password:
    post:
      tags: [account]
      operationId: resetPassword
      summary: Reset the password with a recovery file or a local reset
      description: |
        With a recovery file, available while locked: the file unwraps this
        device's vault master key locally, the daemon re-wraps it under the new
        password, and sealed history is preserved. A file for another account
        or device is rejected.

        With `local: true`, available only while this device is unlocked (the
        vault master key is already in memory). This is the local-administrator
        reset for a forgotten password and does not require the old password.

        Either path preserves the recovery wrap, and other devices keep their
        own local password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: The password was reset and the node is unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The request or recovery file is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "409":
          description: This device has no recovery file or it cannot be used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/pairings:
    get:
      tags: [devices]
      operationId: listPairings
      summary: List pairing sessions on this device
      responses:
        "200":
          description: Pairing sessions for the local account, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pairings]
                properties:
                  pairings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pairing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [devices]
      operationId: createPairing
      summary: Create a pairing code for a new device
      description: |
        The code is valid for ten minutes. It contains the node URL, its pinned
        TLS fingerprint, the account ID, and a one-time secret. Anyone holding
        the code can ask to join the account, so it is shown only to the user.
      responses:
        "201":
          description: The pairing session and its portable code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: LAN transport or pairing is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/pairings/{id}/approve:
    post:
      tags: [devices]
      operationId: approvePairing
      summary: Approve the device that submitted a pairing code
      description: |
        Compare the device fingerprint on both screens first. Approval signs a
        device certificate, adds the device to the account, registers it with
        local rooms, and makes the recovery bundle available to the new device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The approved pairing; the new device is importing now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The pairing is not waiting for approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The pairing expired or was canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/pairings/{id}:
    delete:
      tags: [devices]
      operationId: cancelPairing
      summary: Cancel a pairing session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The pairing is canceled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/pairing/join:
    post:
      tags: [devices]
      operationId: startPairJoin
      summary: Recover an account from a pairing code (new device)
      description: |
        Only available when this device has no account. Starts a background
        exchange: the new device submits its keys, waits for approval on the
        existing device, imports the account and room snapshots, then syncs
        events from each room home. This route does not require an unlocked
        session because there is no local account yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  description: "`toget-pair:v1:` pairing code."
                device_name:
                  type: string
                  maxLength: 64
      responses:
        "202":
          description: Pairing started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairJoin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This device already has an account, or pairing is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The pairing code expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/pairing/join/{id}:
    get:
      tags: [devices]
      operationId: getPairJoin
      summary: Poll a pairing started on this device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current import progress and any warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairJoin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [devices]
      operationId: cancelPairJoin
      summary: Cancel a pairing before it imports the account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The join is canceled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account was already imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/node:
    get:
      tags: [node]
      operationId: getNodeInfo
      summary: Read the LAN node identity
      description: |
        Returns `enabled: false` when this process was started with the LAN
        transport disabled. `info.url` is the pinned HTTPS base URL peers use;
        `info.tls_fingerprint` is the SHA-256 fingerprint of the node
        certificate.
      responses:
        "200":
          description: Node transport status and public identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/node/relay:
    post:
      tags: [node]
      operationId: setNodeRelay
      summary: Change the relay transport at runtime
      description: |
        Accepts `off`, `auto`, or a pinned HTTPS relay URL with its SHA-256
        certificate fingerprint in the fragment (for example
        `https://relay.example.com#fp=<hex>`). The setting is persisted and the
        active relay session reconnects without restarting the node. Automatic
        selection requires a configured directory. The response is the same
        shape as `getNodeInfo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [relay]
              properties:
                relay:
                  type: string
                  description: |
                    `off`, `auto`, or a pinned relay URL with its certificate
                    fingerprint.
                  maxLength: 4096
      responses:
        "200":
          description: The setting was applied and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeInfoResponse"
        "400":
          description: The relay setting is invalid or automatic mode has no directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          description: The setting could not be saved to disk; the previous setting remains active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/node/discover:
    get:
      tags: [node]
      operationId: discoverServers
      summary: List Toget nodes visible on the local network
      description: |
        Returns self-reported multicast-DNS advertisements. The advertisement
        is not authentication; use `lookupServer` to verify a peer's signed
        identity and node manifests before connecting.
      responses:
        "200":
          description: Current LAN discoveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/node/lookup:
    get:
      tags: [node]
      operationId: lookupServer
      summary: Resolve a server code over saved cards, the LAN, or the public directory
      description: |
        Resolves in this order:

        1. A saved card for this server code. The card's endpoint is used only
           after the live node proves its identity over pinned TLS.
        2. A node advertising this code on the local network, verified over
           pinned TLS with its signed identity and node manifests.
        3. The configured directory, with the same signature checks repeated
           locally.

        A saved card also pins the full server ID for its eight-digit code: a
        different server ID from mDNS or the directory is rejected. A
        compromised directory cannot substitute an endpoint without failing
        these checks.
      parameters:
        - name: code
          in: query
          required: true
          description: Eight-digit server code.
          schema:
            type: string
            pattern: "^[0-9]{8}$"
      responses:
        "200":
          description: Verified server record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryRecord"
        "400":
          description: Invalid server code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No saved card, LAN node, or directory entry has this server code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          description: The saved card, LAN peer, or directory could not be reached or returned an invalid record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/node/sync:
    post:
      tags: [node]
      operationId: syncNode
      summary: Start a sync pass for every remote room
      description: Returns immediately; rooms are synchronized in the background.
      responses:
        "200":
          description: The sync pass was scheduled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/card:
    get:
      tags: [node]
      operationId: getOwnCard
      summary: Render this node's portable business card
      description: |
        Builds a `toget-card:v1:` string containing this account's signed
        one-year identity manifest and a freshly signed 24-hour node manifest.
        The card is a portable introduction: it works without a directory, but
        a receiver always verifies the live node before trusting it. The
        default label is the account name.
      parameters:
        - name: label
          in: query
          required: false
          description: Optional display label embedded in the card (up to 128 characters).
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: The current card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "400":
          description: The label is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/card/qr:
    get:
      tags: [node]
      operationId: getOwnCardQR
      summary: Render this node's business card as a PNG QR code
      parameters:
        - name: label
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: scale
          in: query
          required: false
          description: Pixels per QR module.
          schema:
            type: integer
            minimum: 2
            maximum: 32
            default: 8
      responses:
        "200":
          description: A PNG QR code for the current card.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: The scale or label is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The card is too large to fit in a QR code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/cards:
    get:
      tags: [node]
      operationId: listSavedCards
      summary: List saved business cards
      description: Returns an empty list when the node transport is disabled.
      responses:
        "200":
          description: Saved cards, sorted by label and server ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [node]
      operationId: addSavedCard
      summary: Verify and save a business card
      description: |
        Verifies the embedded identity and node signatures before saving. An
        expired 24-hour node manifest is still accepted because the card is
        only a hint: the live node is re-verified when the card is used.
        Saving a card with the same server ID updates it in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCardRequest"
      responses:
        "201":
          description: The verified saved card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "400":
          description: The card is malformed, fails verification, belongs to this node, or the label is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/cards/{id}:
    delete:
      tags: [node]
      operationId: removeSavedCard
      summary: Remove a saved business card
      parameters:
        - name: id
          in: path
          required: true
          description: Full server ID (`tog1:s:…`) of the saved card.
          schema:
            type: string
      responses:
        "204":
          description: The card was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No saved card has this server ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms, newest first
      parameters:
        - name: include_archived
          in: query
          description: Set to `1` to include archived rooms.
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
      responses:
        "200":
          description: Rooms visible to this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room and its first event
      description: |
        With `home: node` (the default), when the LAN node is running, new
        rooms are assigned this node as their home server and get a portable
        LAN address. With `home: official`, the room is created on the
        connected official account host: the host orders sealed events and
        stores ciphertext plus routing metadata, but never receives the room
        name, topic, message text, attachments, or epoch keys. Official rooms
        currently reject attachments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: The room and its `room.created` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "409":
          description: |
            `official_account_required` when `home: official` is requested
            without a connected official account, or the official host
            rejected the room creation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rooms/{id}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Read one room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
    patch:
      tags: [rooms]
      operationId: updateRoom
      summary: Rename a room or change its topic
      description: |
        Only active room owners can change room settings. For an official room,
        the owner posts a sealed `room.settings_changed` event to the blind
        host, which stores ciphertext only; a non-owner receives `403`.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: The updated room and `room.settings_changed` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          $ref: "#/components/responses/RemoteReadOnly"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rooms/{id}/archive:
    post:
      tags: [rooms]
      operationId: archiveRoom
      summary: Archive a room
      description: |
        On a room hosted by this node, the owner archives it for everyone and
        the response includes the `room.archived` event. On a room hosted by
        another node, this hides the room on this device only: no event is
        written and `event` is `null`. A member can still use this after
        leaving a remote room.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: The archived room and, for a home-node archive, the `room.archived` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/sync:
    post:
      tags: [node]
      operationId: syncRoom
      summary: Synchronize one remote room from its home node
      description: |
        Fetches events after the local head, verifies and imports them, and
        returns the number of newly imported events. Rooms hosted by this node
        return zero.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [imported]
                properties:
                  imported:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rooms/{id}/events:
    get:
      tags: [rooms]
      operationId: listRoomEvents
      summary: Read a room timeline
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: after
          in: query
          description: Return events with a sequence greater than this value.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum number of events. The node caps this at 1000.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 200
        - name: type
          in: query
          description: Return only events of this type (for example `message.posted`).
          schema:
            type: string
      responses:
        "200":
          description: Events in sequence order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/CorruptEvent"

  /api/v1/rooms/{id}/messages:
    post:
      tags: [messages]
      operationId: postMessage
      summary: Append a message to a room
      description: |
        In a room hosted by another LAN node, the message is sealed locally,
        proposed to the home node, verified there, then installed locally in
        canonical order. Attachments in remote rooms are not supported yet.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "201":
          description: The appended `message.posted` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "413":
          $ref: "#/components/responses/MessageTooLong"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/rooms/{id}/messages/{eventID}:
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Append an edit for a message
      description: Events are append-only; an edit adds a `message.edited` event.
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/EventID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "201":
          description: The appended `message.edited` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/rooms/{id}/members:
    get:
      tags: [membership]
      operationId: listMembers
      summary: List humans and Agents in a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Room members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/devices:
    get:
      tags: [membership]
      operationId: listRoomDevices
      summary: List devices that can sign events in a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Room devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/invites:
    post:
      tags: [membership]
      operationId: createInvite
      summary: Create a single-use invitation
      description: |
        The invite secret and, when the LAN node is running, a portable
        `toget-invite:v1:` code are returned exactly once. The code packages
        the secret, home URL, server ID, and room identity so another node on
        the LAN can join without a shared directory. Only the room's home node
        can issue invites.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invitation and `room.member_invited` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          $ref: "#/components/responses/RemoteReadOnly"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/invites/redeem:
    post:
      tags: [membership]
      operationId: redeemInvite
      summary: Join a room with an invite secret or portable LAN code
      description: |
        A plain secret joins a room hosted on this node. A
        `toget-invite:v1:` code contacts the advertised home node over pinned
        HTTPS, authenticates as this account and device, redeems the secret,
        imports the signed join bundle, and imports the events permitted by
        the invite's history policy. For remote joins `event` is `null`.
        Redeeming a fresh invite for a room this account still belongs to
        restores an archived local copy. A device that has already left cannot
        rejoin and receives `409 room_left`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemInviteRequest"
      responses:
        "200":
          description: The joined room, local member row when available, and join event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemInviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This account is already a member, or this device has already left the room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/rooms/{id}/leave:
    post:
      tags: [membership]
      operationId: leaveRoom
      summary: Leave a room
      description: |
        On a room hosted by this node, the leave is appended locally and the
        room epoch rotates. On a room hosted by another node, the device signs
        a self-leave event, the home node verifies and appends it, rotates the
        epoch, and rejects future syncs from the departed device. In both cases
        the room is archived on this device after leaving.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: The appended `room.member_left` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: The home node log moved; the request was retried or can be retried after syncing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/audit:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Export the signed event chain of a room
      description: |
        The bundle contains the room, members, devices, every visible event, the
        head hash, and the generation time. `verified` reports whether the hash
        chain and signatures validate locally.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Audit bundle and local verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/audit/verify:
    post:
      tags: [audit]
      operationId: verifyAudit
      summary: Verify an audit bundle offline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Audit"
      responses:
        "200":
          description: The bundle is valid.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verified, head, events]
                properties:
                  verified:
                    type: boolean
                    const: true
                  head:
                    type: string
                  events:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
        "422":
          description: The hash chain or a signature is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/search:
    get:
      tags: [search]
      operationId: searchAllRooms
      summary: Search decrypted local history across all rooms
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SearchLimit"
      responses:
        "200":
          description: Matching events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/search:
    get:
      tags: [search]
      operationId: searchRoom
      summary: Search decrypted local history in one room
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SearchLimit"
      responses:
        "200":
          description: Matching events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/read:
    get:
      tags: [rooms]
      operationId: getReadCursor
      summary: Read this device's read position in a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: The read cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [rooms]
      operationId: setReadCursor
      summary: Set this device's read position in a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadCursorRequest"
      responses:
        "200":
          description: The stored read cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/unread:
    get:
      tags: [rooms]
      operationId: getUnread
      summary: Count events after this device's read cursor
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Unread count.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unread]
                properties:
                  unread:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/attachments:
    get:
      tags: [attachments]
      operationId: listAttachments
      summary: List attachments uploaded to a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Room attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: Upload an attachment encrypted under the room epoch key
      description: |
        The request body is the raw file (up to 25 MiB). The node seals it with
        the current room-epoch key, stores the ciphertext, and returns
        metadata. Attach the returned ID to a message with `attachments`.
        For a room hosted by another node, the same sealed bytes are uploaded
        to the home node, which stores them without the room key; peers
        download them lazily on first open.
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: name
          in: query
          description: Original filename. Falls back to `X-Toget-Filename`.
          schema:
            type: string
        - name: mime
          in: query
          description: MIME type. Falls back to `Content-Type`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored attachment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "413":
          $ref: "#/components/responses/AttachmentTooLarge"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/attachments/{id}:
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Read attachment metadata
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: Attachment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/attachments/{id}/content:
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: Download and decrypt an attachment
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: |
            The decrypted bytes with the stored MIME type, a sanitized
            `Content-Disposition`, `X-Content-Type-Options: nosniff`, and a
            sandboxing CSP.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List Agents owned by this account
      responses:
        "200":
          description: Owned Agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [agents]
      operationId: createAgent
      summary: Register a local Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: The registered Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/agents/{id}:
    get:
      tags: [agents]
      operationId: getAgent
      summary: Read one owned Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: The Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: Update an Agent's presence
      description: |
        Optionally posts an `agent.status` event to a room. Allowed statuses
        are `idle`, `running`, `waiting_approval`, and `offline`.
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: The updated Agent and optional status event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/agents/{id}/revoke:
    post:
      tags: [agents]
      operationId: revokeAgent
      summary: Revoke an Agent
      description: |
        Permanently disables the Agent and removes it from every room with an
        `agent.left` event whose reason is `revoked`. If a room cannot be
        reached, the call fails before the Agent is marked revoked; a retry
        finishes the remaining rooms. Revocation is idempotent.
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "204":
          description: The Agent is revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/agents/{id}/rooms:
    get:
      tags: [agents]
      operationId: listAgentRooms
      summary: List rooms an Agent belongs to
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Room references.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentRoomRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/agents/{id}/sessions:
    get:
      tags: [agents]
      operationId: listAgentSessions
      summary: List an Agent's per-room runtime sessions
      description: |
        Sessions are local runtime state, not room events. They track the
        catch-up cursor, the resumed runtime conversation, run count, and the
        last error for each (Agent, Room) pair.
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Runtime sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/agents/{id}/sessions/{roomID}:
    delete:
      tags: [agents]
      operationId: resetAgentSession
      summary: Reset an Agent's runtime session in a room
      description: |
        Clears the runtime conversation and moves both cursors to the current
        room head. The Agent starts fresh on its next mention. If a run is
        active in that room, it is stopped first.
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/AgentRoomID"
      responses:
        "200":
          description: The reset session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/agents/{id}/stop:
    post:
      tags: [agents]
      operationId: stopAgent
      summary: Stop an Agent's active run
      description: |
        Cancels the local runtime process. The mention is not marked complete,
        so it stays in the next catch-up context. Returns 409 when no run is
        active.
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: The run was cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stopped]
                properties:
                  stopped:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/agents:
    get:
      tags: [agents]
      operationId: listRoomAgents
      summary: List Agents that belong to a room
      description: |
        Returns this node's Agent records plus Agents announced in the room
        log by other members. Remote entries carry the name, runtime, owner,
        and last status from their `agent.joined` and `agent.status` events;
        the local registry wins when both describe the same Agent.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Room Agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [agents]
      operationId: joinRoomAgent
      summary: Add an owned Agent to a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinAgentRequest"
      responses:
        "201":
          description: The Agent and `agent.joined` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/rooms/{id}/agents/{agentID}:
    delete:
      tags: [agents]
      operationId: leaveRoomAgent
      summary: Remove an owned Agent from a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: agentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The `agent.left` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/rooms/{id}/agent-streams:
    get:
      tags: [agents]
      operationId: listRoomAgentStreams
      summary: Read partial output from active Agent runs
      description: |
        Returns transient, in-memory partial output for Agents running on this
        node. The text is capped at 64 KiB per run and is never written to the
        room event log; the final reply is still a `message.posted` event.
        Streams are visible only to members of the room and only on the Agent
        owner's node. Poll this endpoint while a room is open; an empty array
        means no local run is active.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Active local Agent streams in the room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStreamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approvals in a room
      description: Expired approvals are transitioned before listing.
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: status
          in: query
          description: Filter by approval status.
          schema:
            type: string
            enum: [pending, granted, rejected, expired]
      responses:
        "200":
          description: Approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [approvals]
      operationId: requestApproval
      summary: Request approval for an exact action
      description: |
        The action is canonicalized and hashed. The digest is the only thing a
        consumer may later redeem, so changing any field requires a new
        approval. Defaults to a 15-minute TTL and caps at 24 hours.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestApprovalRequest"
      responses:
        "201":
          description: The pending approval and `approval.requested` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/approvals/{id}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Read one approval
      parameters:
        - $ref: "#/components/parameters/ApprovalID"
      responses:
        "200":
          description: The approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/approvals/{id}/decide:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Grant or reject a pending approval
      parameters:
        - $ref: "#/components/parameters/ApprovalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: The decided approval and `approval.granted` or `approval.rejected` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The approval is no longer pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/approvals/{id}/consume:
    post:
      tags: [approvals]
      operationId: consumeApproval
      summary: Redeem a granted approval exactly once
      description: The supplied digest must equal the stored action digest.
      parameters:
        - $ref: "#/components/parameters/ApprovalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeApprovalRequest"
      responses:
        "200":
          description: The consumed approval and `approval.consumed` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The approval is not granted, already used, expired, or the digest does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/policies:
    get:
      tags: [policies]
      operationId: listPolicies
      summary: List room and per-Agent policies
      description: |
        Returns the room default policy first, then one policy per Agent that
        has its own rule set. Any room member may read policies.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Policies for the room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
    put:
      tags: [policies]
      operationId: savePolicy
      summary: Replace a room or per-Agent policy
      description: |
        An empty `agent_id` replaces the room default policy; otherwise the
        rules apply only to that Agent. Saving replaces the whole rule set.
        The room owner may manage any policy; an Agent owner may manage that
        Agent's policy. A matching allow pre-authorizes the action, a matching
        deny always wins, and an unmatched action still needs human approval.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePolicyRequest"
      responses:
        "200":
          description: The saved policy and `policy.updated` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: The Agent is not an active member of the room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"
    delete:
      tags: [policies]
      operationId: deletePolicy
      summary: Delete a room or per-Agent policy
      description: The Agent's actions then fall back to the room default.
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: agent_id
          in: query
          description: Omit or leave empty for the room default policy.
          schema:
            type: string
      responses:
        "200":
          description: The `policy.deleted` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDeletedView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/policies/evaluate:
    post:
      tags: [policies]
      operationId: evaluatePolicy
      summary: Evaluate one action against a room's policies
      description: |
        Dry-run evaluation for UI previews. `at` is optional and defaults to
        the node clock. The result does not create an approval or event.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluatePolicyRequest"
      responses:
        "200":
          description: The policy decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/rooms/{id}/tools:
    get:
      tags: [tools]
      operationId: listToolReceipts
      summary: List tool receipts in a room
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: limit
          in: query
          description: Maximum number of receipts. The node caps this at 500.
          schema:
            type: integer
            minimum: 0
            default: 100
      responses:
        "200":
          description: Tool receipts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolReceiptList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "423":
          $ref: "#/components/responses/Locked"
    post:
      tags: [tools]
      operationId: requestToolCall
      summary: Record a tool call before it runs
      description: |
        `read` tool calls are allowed directly. `write`, `external`, `shell`,
        and `native` calls require a granted, unconsumed approval whose action
        digest binds this exact call.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestToolCall"
      responses:
        "201":
          description: The tool receipt and `tool.requested` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolReceiptWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: The approval is missing, expired, already used, or does not match the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

  /api/v1/tools/{id}:
    get:
      tags: [tools]
      operationId: getToolReceipt
      summary: Read one tool receipt
      parameters:
        - $ref: "#/components/parameters/ToolID"
      responses:
        "200":
          description: The tool receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
    patch:
      tags: [tools]
      operationId: completeToolCall
      summary: Complete a tool receipt
      description: Records the output and marks the call succeeded or failed.
      parameters:
        - $ref: "#/components/parameters/ToolID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteToolCallRequest"
      responses:
        "200":
          description: The completed receipt and `tool.result` or `tool.failed` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolReceiptWithEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The receipt was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/Locked"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token read from the user-only `api-token` file.
    cookieAuth:
      type: apiKey
      in: cookie
      name: toget_token
      description: HttpOnly, SameSite=Strict cookie set when the web UI loads.

  parameters:
    RoomID:
      name: id
      in: path
      required: true
      description: Room ID (UUIDv7 for locally created rooms).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    EventID:
      name: eventID
      in: path
      required: true
      description: Event ID of the message being edited.
      schema:
        type: string
    AttachmentID:
      name: id
      in: path
      required: true
      description: Attachment ID.
      schema:
        type: string
    AgentID:
      name: id
      in: path
      required: true
      description: Agent ID.
      schema:
        type: string
    AgentRoomID:
      name: roomID
      in: path
      required: true
      description: Room ID of the Agent's runtime session.
      schema:
        type: string
    ApprovalID:
      name: id
      in: path
      required: true
      description: Approval ID.
      schema:
        type: string
    ToolID:
      name: id
      in: path
      required: true
      description: Tool receipt ID.
      schema:
        type: string
    SearchQuery:
      name: q
      in: query
      required: true
      description: Case-insensitive substring matched against decrypted local events.
      schema:
        type: string
        minLength: 1
    SearchLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A local API token is required.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="toget"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCredentials:
      description: The account password is incorrect.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OriginDenied:
      description: The request Origin is not a loopback origin for this node.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountNotFound:
      description: This node has no account yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountExists:
      description: This node already has an account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Locked:
      description: The local session is locked. Unlock with `POST /api/v1/session`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested object does not exist or is not visible to this account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoomNotFound:
      description: The room does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: This account or device is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state, such as an Agent that is not in the room.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RemoteReadOnly:
      description: The room is hosted by another node; this mutation is a home-node decision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageTooLong:
      description: The message exceeds the local size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AttachmentTooLarge:
      description: The attachment exceeds the 25 MiB per-file limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The uploaded file exceeds the endpoint's size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CorruptEvent:
      description: An event failed its integrity check.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed unlock attempts; wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The requested local subsystem is not configured or not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: A downstream peer or service failed, or an update operation could not complete.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The local node could not complete the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              examples:
                - account_not_found
            message:
              type: string
              description: Human-readable explanation.

    VersionInfo:
      type: object
      additionalProperties: false
      required: [app, commit, build_time, protocol, schema, go_version, os, arch]
      properties:
        app:
          type: string
          examples: [0.1.0-dev]
        commit:
          type: string
        build_time:
          type: string
        protocol:
          type: integer
        schema:
          type: integer
        go_version:
          type: string
        os:
          type: string
        arch:
          type: string

    AccountSyncResult:
      type: object
      additionalProperties: false
      required: [peers, synced]
      properties:
        peers:
          type: integer
          minimum: 0
          description: Paired devices with a known address in this round.
        synced:
          type: integer
          minimum: 0
          description: Peers that completed an exchange.
        warnings:
          type: array
          items:
            type: string
          description: Unreachable peers, rejected records, or offline room homes.
        revoked:
          type: array
          items:
            type: string
          description: Device IDs first learned as revoked in this round.

    RotateAccountKeyResult:
      type: object
      additionalProperties: false
      required: [generation, devices, warnings]
      properties:
        generation:
          type: integer
          minimum: 2
          description: New account key generation.
        devices:
          type: integer
          minimum: 0
          description: Active device certificates re-signed with the new key.
        warnings:
          type: array
          items:
            type: string
          description: Room homes that could not be updated yet; account sync retries.

    Pairing:
      type: object
      additionalProperties: false
      required: [id, status, expires_at, created_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [waiting, requested, approving, approved, expired, canceled]
        device_id:
          type: string
          description: Present once a new device submits the code.
        device_name:
          type: string
        fingerprint:
          type: string
          description: Fingerprint of the requesting device signing key.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        code:
          type: string
          description: Portable `toget-pair:v1:` code, present only while no device has claimed the pairing. Treat it as a bearer secret.
        warnings:
          type: array
          items:
            type: string

    PairJoin:
      type: object
      additionalProperties: false
      required: [id, status, device_name, fingerprint, account_id, started_at, updated_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [waiting, awaiting_approval, importing, ready, failed, canceled, expired]
        device_name:
          type: string
        fingerprint:
          type: string
        account_id:
          type: string
        error:
          type: string
        warnings:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Device:
      type: object
      additionalProperties: false
      required: [id, name, role, fingerprint, current, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          examples: [primary]
        fingerprint:
          type: string
          description: Base64url SHA-256 fingerprint of the device signing key.
        current:
          type: boolean
          description: True for the device making this request.
        last_seen_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time

    Account:
      type: object
      additionalProperties: false
      required: [id, name, server_id, server_code, key_generation, created_at]
      properties:
        id:
          type: string
          description: "14 decimal digits: 8-digit server code plus 6-digit account code."
          pattern: "^[0-9]{14}$"
          examples: ["68173501840479"]
        name:
          type: string
        server_id:
          type: string
          description: Full fingerprint of the server root key.
          examples: ["tog1:s:5774DJPB5NPVMTFV48P6B1MWJ1AK22P7J0949BNZ3KJN8YXMXNE0"]
        server_code:
          type: string
          pattern: "^[0-9]{8}$"
        host_url:
          type: string
          format: uri
          description: |
            Official account host URL with exactly one trust anchor; absent for
            a self-hosted account. `#fp=<hex>` (alias `#sha256=<hex>`) pins the
            exact origin TLS certificate for a direct connection.
            `#id=<server-id>` validates a TLS-terminating proxy through the
            signed host manifest.
          examples: ["https://accounts.example.com#fp=...", "https://accounts.example.com#id=tog1:s:..."]
        key_generation:
          type: integer
          minimum: 1
          description: Current account signing-key generation; starts at 1.
        created_at:
          type: string
          format: date-time
        device:
          $ref: "#/components/schemas/Device"

    CreatedAccount:
      type: object
      additionalProperties: false
      required: [id, name, server_id, server_code, key_generation, created_at]
      properties:
        id:
          type: string
          description: "14 decimal digits: 8-digit server code plus 6-digit account code."
          pattern: "^[0-9]{14}$"
        name:
          type: string
        server_id:
          type: string
          description: Full fingerprint of the server root key.
        server_code:
          type: string
          pattern: "^[0-9]{8}$"
        host_url:
          type: string
          format: uri
          description: |
            Official account host URL with exactly one trust anchor; absent for
            a self-hosted account. `#fp=<hex>` (alias `#sha256=<hex>`) pins the
            exact origin TLS certificate for a direct connection.
            `#id=<server-id>` validates a TLS-terminating proxy through the
            signed host manifest.
        key_generation:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        device:
          $ref: "#/components/schemas/Device"
        recovery:
          $ref: "#/components/schemas/RecoveryCredential"

    HostedLoginRequest:
      type: object
      additionalProperties: false
      required: [host_url, account_id, password]
      properties:
        host_url:
          type: string
          format: uri
          description: |
            Official account host URL with exactly one trust anchor:
            `#fp=<hex>` (alias `#sha256=<hex>`) for an exact origin
            certificate pin, or `#id=<server-id>` behind a TLS-terminating
            proxy.
        account_id:
          type: string
          pattern: "^[0-9]{14}$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
        device_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Defaults to the machine hostname.

    HostedLoginResponse:
      type: object
      additionalProperties: false
      required: [id, name, server_id, server_code, key_generation, created_at]
      properties:
        id:
          type: string
          pattern: "^[0-9]{14}$"
        name:
          type: string
        server_id:
          type: string
        server_code:
          type: string
          pattern: "^[0-9]{8}$"
        host_url:
          type: string
          format: uri
        key_generation:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        device:
          $ref: "#/components/schemas/Device"
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal sync or room-home warnings from the login.

    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    BackupFile:
      type: object
      additionalProperties: false
      required: [path, size, sha256]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string

    BackupManifest:
      type: object
      additionalProperties: false
      required: [format, version, created_at, schema_version, files]
      properties:
        format:
          type: string
          const: toget-backup
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        app_version:
          type: string
        schema_version:
          type: integer
        files:
          type: array
          items:
            $ref: "#/components/schemas/BackupFile"

    BackupArchive:
      type: object
      additionalProperties: false
      required: [name, size, manifest]
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        manifest:
          $ref: "#/components/schemas/BackupManifest"

    BackupList:
      type: object
      additionalProperties: false
      required: [backups]
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/BackupArchive"

    RestoreUpload:
      type: object
      additionalProperties: false
      required: [id, size, manifest]
      properties:
        id:
          type: string
        size:
          type: integer
          format: int64
        manifest:
          $ref: "#/components/schemas/BackupManifest"

    RestorePending:
      type: object
      additionalProperties: false
      required: [manifest, size, staged_at]
      properties:
        manifest:
          $ref: "#/components/schemas/BackupManifest"
        size:
          type: integer
          format: int64
        staged_at:
          type: string
          format: date-time

    RestoreStatus:
      type: object
      additionalProperties: false
      required: [staged, restart_configured, restart_supported]
      properties:
        staged:
          oneOf:
            - $ref: "#/components/schemas/RestorePending"
            - type: "null"
        restart_configured:
          type: boolean
        restart_supported:
          type: boolean

    StageRestoreRequest:
      type: object
      additionalProperties: false
      properties:
        backup_name:
          type: string
          description: Name of a local backup. Mutually exclusive with upload_id.
        upload_id:
          type: string
          description: ID returned by the upload endpoint. Mutually exclusive with backup_name.

    RestoreRestartResponse:
      type: object
      additionalProperties: false
      required: [restarting]
      properties:
        restarting:
          type: boolean

    NotificationSubscription:
      type: object
      additionalProperties: false
      required:
        [id, endpoint_host, label, language, user_agent, enabled, message_events,
         approval_events, created_at, failure_count]
      properties:
        id:
          type: string
        endpoint_host:
          type: string
          description: Hostname of the push service, for identification only.
        label:
          type: string
        language:
          type: string
          enum: [en, zh]
        user_agent:
          type: string
        enabled:
          type: boolean
        message_events:
          type: boolean
        approval_events:
          type: boolean
        muted_until:
          type: string
          format: date-time
          description: Per-browser mute deadline. Omitted when not muted.
        created_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
          description: Last accepted delivery. Omitted when never delivered.
        last_failure_at:
          type: string
          format: date-time
          description: Last failed delivery. Omitted when never failed.
        failure_count:
          type: integer
          minimum: 0

    NotificationStatus:
      type: object
      additionalProperties: false
      required: [public_key, subscriptions]
      properties:
        public_key:
          type: string
          description: Base64url VAPID P-256 public key for PushManager.subscribe.
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/NotificationSubscription"
        muted_until:
          type: string
          format: date-time
          description: Global mute deadline. Omitted when notifications are on.

    NotificationSubscriptionInput:
      type: object
      additionalProperties: false
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
          format: uri
          description: Push service endpoint. Must use HTTPS; loopback HTTP is allowed for development.
        p256dh:
          type: string
          description: Base64url uncompressed P-256 browser public key.
        auth:
          type: string
          description: Base64url 16-byte authentication secret.
        language:
          type: string
          description: Preferred notification language. Defaults to English.
        user_agent:
          type: string
          description: Browser description for the settings list.
        label:
          type: string
          description: User-visible device label.

    NotificationSubscriptionUpdate:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        enabled:
          type: boolean
        message_events:
          type: boolean
        approval_events:
          type: boolean
        muted_until:
          type: string
          description: RFC3339 mute deadline; an empty string clears the per-browser mute.

    NotificationMuteRequest:
      type: object
      additionalProperties: false
      required: [hours]
      properties:
        hours:
          type: integer
          minimum: 0
          maximum: 168
          description: Hours to pause notifications; 0 turns them back on.

    NotificationTestResponse:
      type: object
      additionalProperties: false
      required: [sent]
      properties:
        sent:
          type: boolean

    UpdateStatus:
      type: object
      additionalProperties: false
      required: [enabled, mode, channel, check_interval, current, restart_configured, restart_supported]
      properties:
        enabled:
          type: boolean
          description: Whether the update monitor is configured and running.
        mode:
          type: string
          enum: [notify, auto, off]
          description: Scheduled check policy. `auto` stages but never restarts.
        channel:
          type: string
          examples: [stable]
        check_interval:
          type: string
          description: Effective Go duration between scheduled checks.
          examples: ["6h0m0s"]
        last_check:
          type:
            - string
            - "null"
          format: date-time
        last_error:
          type: string
        current:
          $ref: "#/components/schemas/UpdateCurrent"
        result:
          $ref: "#/components/schemas/UpdateCheckResult"
        dismissed:
          type: boolean
        dismissed_until:
          type:
            - string
            - "null"
          format: date-time
        staged:
          $ref: "#/components/schemas/UpdateApplyResult"
        status:
          $ref: "#/components/schemas/UpdateInstallStatus"
        restart_configured:
          type: boolean
        restart_supported:
          type: boolean
          description: False on Windows, where a staged update needs a manual service restart.
        config_error:
          type: string

    UpdateCurrent:
      type: object
      additionalProperties: false
      required: [app, protocol, schema]
      properties:
        app:
          type: string
        protocol:
          type: integer
        schema:
          type: integer
        release:
          type: string
        manifest_sha256:
          type: string

    UpdateReleaseKey:
      type: object
      additionalProperties: false
      required: [format, version, key_id, public_key, root, not_before, not_after]
      properties:
        format:
          type: string
          const: toget-release-key
        version:
          type: integer
        key_id:
          type: string
        public_key:
          type: string
        root:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        signature:
          type: string

    UpdateChannel:
      type: object
      additionalProperties: false
      required: [format, version, channel, release, manifest, rollout, published_at, release_key]
      properties:
        format:
          type: string
          const: toget-release-channel
        version:
          type: integer
        channel:
          type: string
        release:
          type: string
        manifest:
          type: string
          format: uri
        rollout:
          type: integer
          minimum: 1
          maximum: 100
        published_at:
          type: string
          format: date-time
        release_key:
          $ref: "#/components/schemas/UpdateReleaseKey"
        signature:
          type: string

    UpdateArtifact:
      type: object
      additionalProperties: false
      required: [os, arch, url, sha256, size, format, executable]
      properties:
        os:
          type: string
        arch:
          type: string
        url:
          type: string
          format: uri
        sha256:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
        format:
          type: string
        executable:
          type: string

    UpdateFileRef:
      type: object
      additionalProperties: false
      required: [url, sha256, size]
      properties:
        url:
          type: string
          format: uri
        sha256:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1

    UpdateManifest:
      type: object
      additionalProperties: false
      required: [format, version, release, protocol, schema, level, published_at, artifacts, release_key]
      properties:
        format:
          type: string
          const: toget-release-manifest
        version:
          type: integer
        release:
          type: string
        protocol:
          type: integer
        schema:
          type: integer
        min_app:
          type: string
        min_protocol:
          type: integer
        level:
          type: string
          enum: [recommended, security, forced]
        changelog:
          type: string
        published_at:
          type: string
          format: date-time
        artifacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/UpdateArtifact"
        sbom:
          $ref: "#/components/schemas/UpdateFileRef"
        release_key:
          $ref: "#/components/schemas/UpdateReleaseKey"
        signature:
          type: string

    UpdateCheckRequest:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
          description: Ignore the staged rollout percentage.

    UpdateCheckResult:
      type: object
      additionalProperties: false
      required: [channel_url, manifest_url, channel, manifest, manifest_sha256, current, available, reason]
      properties:
        channel_url:
          type: string
          format: uri
        manifest_url:
          type: string
          format: uri
        channel:
          $ref: "#/components/schemas/UpdateChannel"
        manifest:
          $ref: "#/components/schemas/UpdateManifest"
        manifest_sha256:
          type: string
        artifact:
          $ref: "#/components/schemas/UpdateArtifact"
        sbom:
          $ref: "#/components/schemas/UpdateFileRef"
        current:
          $ref: "#/components/schemas/UpdateCurrent"
        available:
          type: boolean
        reason:
          type: string
          enum:
            - available
            - up_to_date
            - newer_installed
            - rollout
            - no_artifact
            - schema_downgrade
            - protocol_downgrade
            - app_too_old
            - protocol_too_old
        rollout_percent:
          type: integer
          minimum: 0
          maximum: 100
        rollout_bucket:
          type: integer
          minimum: 0
          maximum: 99
        downgrade:
          type: boolean
        warning:
          type: string

    UpdateCheckResponse:
      type: object
      additionalProperties: false
      required: [result, update]
      properties:
        result:
          $ref: "#/components/schemas/UpdateCheckResult"
        update:
          $ref: "#/components/schemas/UpdateStatus"

    UpdateApplyRequest:
      type: object
      additionalProperties: false
      required: [release]
      properties:
        release:
          type: string
          minLength: 1
          maxLength: 64

    UpdateDismissRequest:
      type: object
      additionalProperties: false
      required: [release]
      properties:
        release:
          type: string
          minLength: 1
          maxLength: 64
        hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: Quiet period in hours. Zero uses the 24-hour default.

    UpdateApplyResult:
      type: object
      additionalProperties: false
      required: [release, state]
      properties:
        release:
          type: string
        previous:
          type: string
        executable:
          type: string
        state:
          $ref: "#/components/schemas/UpdateInstallState"
        up_to_date:
          type: boolean
        restarted:
          type: boolean
        needs_restart:
          type: boolean
        warning:
          type: string

    UpdateRollbackResult:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        release:
          type: string
        previous:
          type: string
        state:
          $ref: "#/components/schemas/UpdateInstallState"
        restarted:
          type: boolean
        needs_restart:
          type: boolean

    UpdateApplyResponse:
      type: object
      additionalProperties: false
      required: [result, update]
      properties:
        result:
          oneOf:
            - $ref: "#/components/schemas/UpdateApplyResult"
            - $ref: "#/components/schemas/UpdateRollbackResult"
        update:
          $ref: "#/components/schemas/UpdateStatus"

    UpdateRestartResponse:
      type: object
      additionalProperties: false
      required: [restarting]
      properties:
        restarting:
          type: boolean
          const: true

    UpdatePending:
      type: object
      additionalProperties: false
      required: [release, manifest_sha256, protocol, schema, started_at]
      properties:
        release:
          type: string
        manifest_sha256:
          type: string
        protocol:
          type: integer
        schema:
          type: integer
        channel:
          type: string
        started_at:
          type: string
          format: date-time
        previous:
          type: string
        previous_manifest_sha256:
          type: string
        previous_protocol:
          type: integer
        previous_schema:
          type: integer

    UpdateInstallState:
      type: object
      additionalProperties: false
      required: [format, version, rollout_id]
      properties:
        format:
          type: string
          const: toget-update-state
        version:
          type: integer
        rollout_id:
          type: string
        current:
          type: string
        current_manifest_sha256:
          type: string
        current_protocol:
          type: integer
        current_schema:
          type: integer
        previous:
          type: string
        previous_manifest_sha256:
          type: string
        previous_protocol:
          type: integer
        previous_schema:
          type: integer
        pending:
          $ref: "#/components/schemas/UpdatePending"

    UpdateInstalledVersion:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        format:
          type: string
        version:
          type: integer
        release:
          type: string
        protocol:
          type: integer
        schema:
          type: integer
        executable:
          type: string
        executable_sha256:
          type: string
        manifest_sha256:
          type: string
        archive_sha256:
          type: string
        channel:
          type: string
        installed_at:
          type: string
          format: date-time
        adopted:
          type: boolean
        path:
          type: string

    UpdateInstallStatus:
      type: object
      additionalProperties: false
      required: [root, initialized, state]
      properties:
        root:
          type: string
        initialized:
          type: boolean
        state:
          $ref: "#/components/schemas/UpdateInstallState"
        current_link:
          type: string
        previous_link:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/UpdateInstalledVersion"
        issues:
          type: array
          items:
            type: string

    Status:
      type: object
      additionalProperties: false
      required: [version, account, rooms, agents, pending_approvals, listen, locked]
      properties:
        version:
          $ref: "#/components/schemas/VersionInfo"
        account:
          oneOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
        rooms:
          type: integer
          minimum: 0
        agents:
          type: integer
          minimum: 0
        pending_approvals:
          type: integer
          minimum: 0
        listen:
          type: string
          examples: ["127.0.0.1:7718"]
        locked:
          type: boolean

    Session:
      type: object
      additionalProperties: false
      required: [has_account, locked, ttl_seconds]
      properties:
        has_account:
          type: boolean
        locked:
          type: boolean
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        ttl_seconds:
          type: integer
          examples: [43200]

    UnlockRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password

    Room:
      type: object
      additionalProperties: false
      required: [id, name, home_node, created_by, epoch, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        topic:
          type: string
        home_node:
          type: string
          description: Device ID of the node that orders this room's log.
        home_server_id:
          type: string
          description: Server ID of the home node. Empty until the room is assigned.
        home_address:
          type: string
          description: Pinned HTTPS base URL of the home node, when known.
        home_kind:
          type: string
          enum: [node, official]
          default: node
          description: |
            `node` means a Toget node orders the log and can read events it
            hosts. `official` means the blind official account home only sees
            sealed envelopes and routing metadata.
        created_by:
          type: string
          description: Account ID of the creator.
        epoch:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - "null"
          format: date-time

    RoomEvent:
      type: object
      additionalProperties: false
      required: [id, room_id, seq, epoch, type, author_id, payload, created_at, hash]
      properties:
        id:
          type: string
        room_id:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
        epoch:
          type: integer
          minimum: 1
          description: Room key epoch used to seal the payload.
        type:
          type: string
          examples: ["message.posted"]
        author_id:
          type: string
        author_device:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Decrypted event payload. Shape depends on `type`.
        created_at:
          type: string
          format: date-time
        prev_id:
          type: string
        prev_hash:
          type: string
        hash:
          type: string
          description: SHA-256 hash chain value over the event fields and payload.
        signature:
          type: string
          description: Base64url Ed25519 signature by the author device.

    RoomMember:
      type: object
      additionalProperties: false
      required: [room_id, account_id, display_name, role, status, joined_at]
      properties:
        room_id:
          type: string
        account_id:
          type: string
        device_id:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [owner, member]
        status:
          type: string
          enum: [active, left]
        joined_at:
          type: string
          format: date-time
        left_at:
          type:
            - string
            - "null"
          format: date-time

    RoomDevice:
      type: object
      additionalProperties: false
      required: [room_id, device_id, account_id, joined_at]
      properties:
        room_id:
          type: string
        device_id:
          type: string
        account_id:
          type: string
        joined_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time

    Invite:
      type: object
      additionalProperties: false
      required: [id, room_id, created_by, history, expires_at, created_at]
      properties:
        id:
          type: string
        room_id:
          type: string
        secret:
          type: string
          description: Opaque single-use secret. Returned only at creation.
        code:
          type: string
          description: |
            Portable `toget-invite:v1:` code. It names the home (LAN node or
            official account host) and carries the single-use secret. Returned
            only at creation.
        created_by:
          type: string
        history:
          type: string
          enum: [none, recent, all]
          description: |
            `none` shares nothing before the join; `recent` shares only the
            current key epoch; `all` shares every epoch.
        expires_at:
          type: string
          format: date-time
        used_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time

    RoomList:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"

