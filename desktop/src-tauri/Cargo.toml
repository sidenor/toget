[package]
name = "toget-desktop"
version = "0.1.0"
description = "Toget desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
